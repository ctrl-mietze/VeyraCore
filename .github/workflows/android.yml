name: Android debug build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The hosted Ubuntu runner already ships Android command-line tools.
      # Avoid the legacy SDK 'tools' package requested by setup-android v3.
      - name: Install Android API 36
        run: |
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -Vr | head -n 1)"
          test -n "$SDK_MANAGER"
          "$SDK_MANAGER" --install "platforms;android-36"
      - name: Verify Kotlin/JVM tests and build the APK
        run: bash ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - name: Upload development APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VeyraCore-dev-debug
          path: app/build/outputs/apk/debug/app-debug.apk
