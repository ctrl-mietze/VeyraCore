name: Android debug build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android API 37
        run: sdkmanager --install "platforms;android-37"
      - name: Verify Kotlin/JVM tests and build the APK
        run: bash ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - name: Upload development APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VeyraCore-dev-debug
          path: app/build/outputs/apk/debug/app-debug.apk
